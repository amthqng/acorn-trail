name: Acorn Trail product pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_cloudflare_trigger:
        description: 'One-time deployment of the Cloudflare polling trigger'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  issues: write
  actions: write
  pull-requests: write

concurrency:
  group: acorn-product-controller
  cancel-in-progress: false

jobs:
  deploy-trigger:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_cloudflare_trigger == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare and dispatch credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          test -n "$DISPATCH_TOKEN" || { echo "::error::Missing GH_DISPATCH_TOKEN"; exit 1; }
      - name: Install Cloudflare deployment CLI
        run: npm install --no-save wrangler@4
      - name: Provision scheduled worker secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: printf '%s' "$DISPATCH_TOKEN" | npx wrangler secret put GITHUB_DISPATCH_TOKEN --config wrangler.controller.jsonc
      - name: Deploy scheduled controller trigger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.controller.jsonc
  sync-uat:
    if: github.event_name != 'workflow_dispatch' || inputs.deploy_cloudflare_trigger != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep UAT development and QA tooling current without altering workflows or game candidate
        run: |
          set -euo pipefail
          git fetch origin main uat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B uat-sync origin/uat
          # GitHub's Actions token lacks 'workflows' scope and cannot push
          # merged changes to .github/workflows/*.yml. Preserve the UAT game
          # candidate and sync only non-workflow development/test tooling.
          git restore --source origin/main -- .gitignore AGENTS.md agents orchestration scripts tests
          git add .gitignore AGENTS.md agents orchestration scripts tests
          if git diff --cached --quiet; then
            echo "UAT developer/test tooling is already current"
            exit 0
          fi
          git commit -m "chore: sync UAT QA and developer tools from main"
          git push origin HEAD:uat
  board:
    needs: sync-uat
    # A transient/permission failure in branch syncing must NEVER prevent
    # board recovery, including rejected-UAT and premature-Done guards.
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.deploy_cloudflare_trigger != true)
    runs-on: ubuntu-latest
    outputs:
      discovery: ${{ steps.snapshot.outputs.discovery }}
      ready: ${{ steps.snapshot.outputs.ready }}
      development: ${{ steps.snapshot.outputs.development }}
      qa: ${{ steps.snapshot.outputs.qa }}
      uat: ${{ steps.snapshot.outputs.uat }}
      done: ${{ steps.snapshot.outputs.done }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconcile released cards and historical #60
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash scripts/reconcile-released-issues.sh
      - name: Repair prematurely completed project cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash scripts/restore-premature-done.sh
      - name: Recover closed Discovery cards with merged UAT changes
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash scripts/recover-closed-discovery.sh
      - name: Keep owner-rejected UAT stories in corrective development
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
        run: bash scripts/enforce-rejected-uat.sh
      - name: Read authoritative board state
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
        run: bash scripts/pipeline-board-snapshot.sh
  discovery:
    needs: board
    if: needs.board.outputs.discovery != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.board.outputs.discovery) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix orchestration --no-audit --no-fund && npm run --prefix orchestration check
      - name: Research and move issue to Awaiting Approval
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FEATURE_ISSUE_NUMBER: ${{ matrix.issue }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
        run: |
          set -euo pipefail
          issue="$FEATURE_ISSUE_NUMBER"
          mkdir -p inputs
          gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > inputs/feature-issue.json
          comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body')"
          if ! grep -Fq '<!-- acorn-feature-discovery -->' <<< "$comments"; then
            npx --prefix orchestration tsx orchestration/discover-issue.ts
            gh issue comment "$issue" --body-file artifacts/feature-discovery/comment.md
          fi
          PROJECT_STATUS="Awaiting Approval" GH_TOKEN="$PROJECT_TOKEN" bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$issue"
      - name: Explain discovery failure on issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Discovery automation failed during this run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. The card remains in Discovery; the controller will retry on its next scheduled run. The pipeline owner should investigate the linked failure; no product-owner intervention is required."
  intake:
    needs: board
    if: needs.board.outputs.ready != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.board.outputs.ready) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix orchestration --no-audit --no-fund && npm run --prefix orchestration check
      - name: UX, Tech Lead and owned decision gate
        env:
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          set -euo pipefail
          mkdir -p inputs
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > inputs/dev-issue.json
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" > inputs/issue-comments.json
          # Reassess only new/updated requirements; avoid repeated AI calls and report spam.
          latest="$(jq -r '[.[]|select(.body|contains("<!-- acorn-tech-lead-gate -->"))]|last|.created_at // ""' inputs/issue-comments.json)"
          if [ -n "$latest" ]; then
            changed="$(jq -r --arg last "$latest" '[.[]|select(.user.login!="github-actions[bot]" and .created_at > $last)]|length' inputs/issue-comments.json)"
            # A blocked verdict from an older intake policy must be re-evaluated
            # once rather than permanently stranding an already approved issue.
            current="$(jq -r '[.[]|select(.body|contains("<!-- acorn-tech-lead-gate -->"))]|last|.body // ""' inputs/issue-comments.json)"
            if [ "$changed" -eq 0 ] && { grep -Fq '<!-- acorn-intake-policy-v4 -->' <<< "$current" || grep -Fq '## Tech Lead intake: READY' <<< "$current"; }; then
              echo "Existing Tech Lead assessment is current for #$ISSUE_NUMBER"; exit 0
            fi
          fi
          npx --prefix orchestration tsx orchestration/tech-lead.ts
          gh issue comment "$ISSUE_NUMBER" --body-file artifacts/development-intake/comment.md
          if [ "$(cat artifacts/development-intake/verdict.txt)" = READY ]; then
            echo "Issue $ISSUE_NUMBER approved for implementation"
          else
            echo "::notice::Issue $ISSUE_NUMBER needs a material product decision"
          fi
  recover:
    needs: board
    if: needs.board.outputs.development != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resume failed development without resetting approval
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          DEVELOPMENT: ${{ needs.board.outputs.development }}
        run: |
          set -euo pipefail
          for issue in $(jq -r '.[]' <<< "$DEVELOPMENT"); do
            [ "$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" --jq '.state')" = open ] || continue
            # A previous merged candidate may have been rejected at UAT.
            # Re-entering In Development authorizes an issue-specific correction.
            open_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefName | jq -r --arg prefix "agents/issue-$issue" '[.[] | select(.headRefName==$prefix or (.headRefName | startswith($prefix + "-correction-")))] | sort_by(.number) | last | .number // empty')"
            if [ -n "$open_pr" ]; then
              echo "Issue #$issue has open implementation PR #$open_pr; returning to QA & Review"
              PROJECT_STATUS="QA & Review" GH_TOKEN="$PROJECT_TOKEN" PROJECT_OWNER=amthqng PROJECT_NUMBER=2 bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$issue"
              continue
            fi
            original="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "agents/issue-$issue" --state all --json number,state --jq '.[0].state // empty')"
            if [ "$original" = "MERGED" ]; then
              echo "Issue #$issue has merged UAT candidate and was returned to development; dispatching corrective implementation"
            elif gh api "repos/$GITHUB_REPOSITORY/branches/agents/issue-$issue" >/dev/null 2>&1; then
              # A partially pushed original branch without PR must be recovered
              # before attempting more code changes.
              if gh pr create --repo "$GITHUB_REPOSITORY" --base uat --head "agents/issue-$issue" --title "Implement issue #$issue" --body "Recovered pushed branch for issue #$issue; full QA and UAT still required."; then
                PROJECT_STATUS="QA & Review" GH_TOKEN="$PROJECT_TOKEN" PROJECT_OWNER=amthqng PROJECT_NUMBER=2 bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$issue"
              else
                echo "::warning::Issue #$issue pushed branch has no mergeable PR; preserving In Development"
              fi
              continue
            fi
            active="$(gh run list --workflow implement-approved.yml --json status,displayTitle --limit 80 | jq --arg title "Implement issue #$issue" '[.[]|select(.displayTitle==$title and (.status=="queued" or .status=="in_progress"))]|length')"
            [ "$active" = 0 ] || { echo "Implementation worker active; will check #$issue next cycle"; continue; }
            comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body')"
            # Durable budget uses the owner requirement revision, NOT main's SHA.
            # Updating CI/workflow code must never reset the attempt allowance.
            budget="$(node scripts/attempt-budget.cjs "$issue")"
            attempts="$(jq -r '.attempts' <<< "$budget")"
            revision="$(jq -r '.revision' <<< "$budget")"
            if [ "$(jq -r '.allow' <<< "$budget")" != true ]; then
              echo "::warning::Issue #$issue reached its 2-attempt budget for requirements $revision; waiting for new owner feedback"
              continue
            fi
            # Preserve failure state on the board; only the worker's QA gate may advance it.
            gh workflow run implement-approved.yml --ref main -f issue_number="$issue"
            gh issue comment "$issue" --body "<!-- acorn-attempt-budget:$revision --> <!-- acorn-development-recovery-v3 --> Development recovery attempt $((attempts+1))/2, requirements revision $revision. Card remains In Development."
          done
  qa-handoff:
    needs: board
    if: needs.board.outputs.qa != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJSON(needs.board.outputs.qa) }}
    steps:
      - uses: actions/checkout@v4
      - name: Locate existing PR for QA reconciliation
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          set -euo pipefail
          pr_entry="$(gh pr list --repo "$GITHUB_REPOSITORY" --state all --limit 200 --json number,state,headRefName,createdAt | jq -c --arg prefix "agents/issue-$ISSUE_NUMBER" '[.[] | select(.headRefName==$prefix or (.headRefName | startswith($prefix + "-correction-")))] | sort_by(.number) | last // empty')"
          pr="$(jq -r '.number // empty' <<< "$pr_entry")"
          head="$(jq -r '.headRefName // empty' <<< "$pr_entry")"
          if [ -z "$pr" ]; then
            # The Developer can have pushed its change before PR creation
            # failed. Recover the PR here because the card has already
            # entered QA & Review, not In Development.
            candidate="$(gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' | grep -E "^agents/issue-$ISSUE_NUMBER(-correction-[0-9]+)?$" | sort -V | tail -n 1 || true)"
            if [ -z "$candidate" ]; then
              echo "::warning::Issue #$ISSUE_NUMBER has no pushed implementation branch"; exit 0
            fi
            gh pr create --repo "$GITHUB_REPOSITORY" --base uat --head "$candidate" --title "Implement issue #$ISSUE_NUMBER" --body "Recovered pushed candidate for issue #$ISSUE_NUMBER; independent QA and UAT approval still required."
            pr_entry="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$candidate" --state open --json number,state,headRefName --jq '.[0] // empty')"
            pr="$(jq -r '.number // empty' <<< "$pr_entry")"
            head="$candidate"
            [ -n "$pr" ] || { echo "::error::PR recovery failed for issue #$ISSUE_NUMBER"; exit 1; }
          fi
          # A separate authorized reviewer identity may approve the already AI-reviewed
          # candidate. Never let the repository's Actions identity approve itself.
          state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state --jq '.state')"
          if [ "$state" != "OPEN" ] && [ "$state" != "MERGED" ]; then
            echo "::warning::PR #$pr was closed without merge; QA cannot promote it"; exit 0
          fi
          if [ "$state" = "MERGED" ]; then
            # An older UAT candidate must not be handed off again after the
            # owner rejected it. Only a newly created correction PR can resume.
            rejection_at="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s --arg owner amthqng '[add[] | select(.user.login==$owner and ((.body // "")|test("UAT[[:space:]]*REJECTED";"i")))] | last | .created_at // ""' -r)"
            pr_created="$(jq -r '.createdAt // ""' <<< "$pr_entry")"
            # Owner's ordinary correction comment after a candidate also blocks
            # reuse of that candidate, even without "UAT REJECTED" keywords.
            all_comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s add)"
            feedback_at="$(printf '%s\n' "$all_comments" | bash scripts/latest-uat-feedback.sh "$ISSUE_NUMBER" amthqng)"
            if [ -n "$feedback_at" ]; then
              echo "::warning::Issue #$ISSUE_NUMBER has owner correction feedback after candidate PR #$pr; rejecting stale QA handoff."
              exit 0
            fi
            if [ -n "$rejection_at" ] && [[ "$pr_created" < "$rejection_at" ]]; then
              echo "::warning::Issue #$ISSUE_NUMBER candidate PR #$pr predates owner UAT rejection. Refusing stale UAT handoff."
              exit 0
            fi
            sha="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json mergeCommit --jq '.mergeCommit.oid')"
            comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body')"
            if grep -Fq "UAT-CANDIDATE: #$ISSUE_NUMBER $sha PR #$pr" <<< "$comments" && grep -Fq "acorn-trail-uat-$ISSUE_NUMBER-${sha:0:12}" <<< "$comments"; then
              echo "completed=true" >> "$GITHUB_OUTPUT"
              echo "QA receipt already exists for exact build $sha; restoring Ready for UAT without rebuilding"
              exit 0
            fi
          fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "pr_state=$state" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.found == 'true'
        with:
          ref: ${{ steps.gate.outputs.pr_state == 'MERGED' && 'uat' || steps.gate.outputs.head }}
          # The UAT merge SHA may be an ancestor of HEAD after routine syncs.
          # A shallow clone makes merge-base fail and strands valid QA cards.
          fetch-depth: 0
      - name: Cache tested browser binaries
        if: steps.gate.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-linux-1.56.1
      - name: Fast candidate gameplay and responsive UI smoke tests
        if: steps.gate.outputs.found == 'true'
        timeout-minutes: 7
        run: |
          node --check sw.js
          node --test tests/game.test.cjs
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
          # QA is a bounded smoke check. All 84 stops are tested before release.
          node --test tests/qa-smoke.test.cjs
      - name: Enforce issue-specific owner visual acceptance before UAT
        if: steps.gate.outputs.found == 'true' && matrix.issue == 83
        timeout-minutes: 5
        run: |
          set -euo pipefail
          # Generic smoke tests cannot prove that the rejected border/background
          # is gone. Run the independently maintained acceptance test on the
          # exact PR head (or merged UAT candidate), not the developer's report.
          test -s tests/uat-visual-83.browser.test.cjs
          node --test tests/uat-visual-83.browser.test.cjs
      - name: Verify reviewed candidate and merge to UAT
        if: steps.gate.outputs.found == 'true' && steps.gate.outputs.pr_state == 'OPEN'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.gate.outputs.pr }}
        run: |
          set -euo pipefail
          base="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq '.baseRefName')"
          [ "$base" = "uat" ] || { echo "::error::PR must target uat"; exit 1; }
          # Developer AI review is required by implementation workflow.
          # Separate GitHub-user approval was blocking all PRs because its token was never provisioned.
          gh pr merge "$PR_NUMBER" --merge --repo "$GITHUB_REPOSITORY"
      - name: Verify merged candidate and record immutable UAT SHA
        if: steps.gate.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
          PR_NUMBER: ${{ steps.gate.outputs.pr }}
        run: |
          set -euo pipefail
          base="$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')"
          [ "$base" = "uat" ] || { echo "::error::PR is not targeting uat"; exit 1; }
          approvals="$(gh pr view "$PR_NUMBER" --json reviews --jq '[.reviews[] | select(.state=="APPROVED" and .author.login!="github-actions[bot]")] | length')"
          echo "PR review count: $approvals (automated developer review already completed)"
          sha="$(gh pr view "$PR_NUMBER" --json mergeCommit --jq '.mergeCommit.oid')"
          [ -n "$sha" ] && [ "$sha" != null ]
          git fetch --no-tags origin +refs/heads/uat:refs/remotes/origin/uat
          git merge-base --is-ancestor "$sha" origin/uat || { echo "::error::Merged candidate is no longer in UAT history"; exit 1; }
          echo "<!-- acorn-uat-candidate --> UAT-CANDIDATE: #$ISSUE_NUMBER $sha PR #$PR_NUMBER" | gh issue comment "$ISSUE_NUMBER" --body-file -
      - name: Upload tested UAT candidate
        if: steps.gate.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: uat-issue-${{ matrix.issue }}-pr-${{ steps.gate.outputs.pr }}
          path: |
            index.html
            sw.js
            manifest.webmanifest
            icon-192.png
            icon-512.png
            icon-maskable-512.png
          if-no-files-found: error
          retention-days: 30
      - name: Deploy tested build to isolated Cloudflare UAT preview
        if: steps.gate.outputs.found == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          mkdir -p .cloudflare-uat/public
          for file in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png; do
            test -s "$file"
            cp "$file" .cloudflare-uat/public/
          done
          sha="$(gh pr view "${{ steps.gate.outputs.pr }}" --json mergeCommit --jq '.mergeCommit.oid')"
          short_sha="${sha:0:12}"
          # Immutable worker name per tested candidate: another issue cannot
          # overwrite the build the owner is currently testing.
          jq --arg name "acorn-trail-uat-$ISSUE_NUMBER-$short_sha" '.name=$name' wrangler.uat.jsonc > wrangler.uat.candidate.json
          npx --yes wrangler@4 deploy --config wrangler.uat.candidate.json | tee /tmp/uat-deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/uat-deploy.log | tail -n 1 || true)"
          [ -n "$url" ] || { echo "::error::No public preview URL returned by Cloudflare"; exit 1; }
          gh issue comment "$ISSUE_NUMBER" --body "UAT-PREVIEW: $url (test the candidate in the latest UAT-CANDIDATE receipt before accepting)"
      - name: Move reviewed and tested change to Ready for UAT
        if: steps.gate.outputs.found == 'true' || steps.gate.outputs.completed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
          PROJECT_STATUS: Ready for UAT
          ISSUE_NUMBER: ${{ matrix.issue }}
        run: bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
  dispatch:
    needs: [board, intake]
    if: always() && needs.board.result == 'success' && needs.intake.result == 'success' && needs.board.outputs.ready != '[]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch approved work with bounded attempts
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          READY: ${{ needs.board.outputs.ready }}
        run: |
          set -euo pipefail
          for issue in $(jq -r '.[]' <<< "$READY"); do
            comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body')"
            latest="$(printf '%s\n' "$comments" | grep '## Tech Lead intake:' | tail -n 1 || true)"
            [ "$latest" = "## Tech Lead intake: READY" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/branches/agents/issue-$issue" >/dev/null 2>&1; then continue; fi
            budget="$(node scripts/attempt-budget.cjs "$issue")"
            attempts="$(jq -r '.attempts' <<< "$budget")"
            revision="$(jq -r '.revision' <<< "$budget")"
            if [ "$(jq -r '.allow' <<< "$budget")" != true ]; then
              echo "::warning::Issue #$issue reached its 2-attempt budget for requirements $revision; awaits a new requirement revision"
              continue
            fi
            # Prevent duplicate starts when earlier workflow is still active.
            active="$(gh run list --workflow implement-approved.yml --json status,displayTitle --limit 80 | jq --arg title "Implement issue #$issue" '[.[]|select(.displayTitle==$title and (.status=="queued" or .status=="in_progress"))]|length')"
            [ "$active" = 0 ] || continue
            gh workflow run implement-approved.yml --ref main -f issue_number="$issue"
            gh issue comment "$issue" --body "<!-- acorn-attempt-budget:$revision --> <!-- acorn-implementation-dispatched-v2 --> Implementation attempt $((attempts+1))/2, requirements revision $revision queued for #$issue."
          done
