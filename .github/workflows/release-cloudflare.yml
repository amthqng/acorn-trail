name: Release accepted UAT to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: acorn-cloudflare-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Publish UAT-accepted implementation
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
          PROJECT_STATUS: Done
        run: |
          set -euo pipefail
          test -n "$PROJECT_TOKEN" || { echo "::error::PROJECTS_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; }
          GH_TOKEN="$PROJECT_TOKEN" bash scripts/list-project-status-issues.sh | sort -nu > /tmp/accepted
          while IFS= read -r issue; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || continue
            if gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body' | grep -Fq '<!-- acorn-cloudflare-published -->'; then continue; fi
            # Done is the product owner's UAT acceptance on the project board.
            # A verified merged implementation PR is required before deployment.
            # Emergency safety gate: a Done card can result from project automation,
            # not necessarily owner UAT acceptance. Do not trust it alone.
            issue_comments="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100")"
            branch="agents/issue-$issue"
            pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --head "$branch" --json number,mergeCommit --jq '.[0] // empty')"
            if [ -z "$pr" ]; then echo "::warning::Issue #$issue has no merged implementation PR"; continue; fi
            pr_number="$(jq -r '.number' <<< "$pr")"
            merged_sha="$(jq -r '.mergeCommit.oid' <<< "$pr")"
            candidate="$(jq -r --arg issue "$issue" '[.[] | select(.body | contains("UAT-CANDIDATE: #" + $issue + " ")) | .body] | last // ""' <<< "$issue_comments")"
            if ! grep -Fq "UAT-CANDIDATE: #$issue $merged_sha PR #$pr_number" <<< "$candidate"; then
              echo "::warning::Issue #$issue lacks candidate receipt for exact PR merge SHA"; continue
            fi
            accepted="$(jq -r --arg issue "$issue" --arg sha "$merged_sha" '[.[] | select(.user.login == "amthqng") | select(.body | contains("UAT-ACCEPTED: #" + $issue + " " + $sha))] | length' <<< "$issue_comments")"
            if [ "$accepted" -eq 0 ]; then
              echo "::warning::Issue #$issue requires owner acceptance for the exact UAT SHA $merged_sha"; continue
            fi
            state="$(jq -r '.state' <<< "$pr")"
            if [ "$state" != "MERGED" ]; then
              echo "::warning::Issue #$issue has no merged UAT implementation PR"
              continue
            fi
            base="$(gh pr view "$pr_number" --json baseRefName --jq '.baseRefName')"
            if [ "$base" != "uat" ]; then
              echo "::warning::Issue #$issue belongs to a legacy main PR; not eligible for new UAT promotion"
              continue
            fi
            # Fail closed: merge the UAT candidate only when it is the exact,
            # sole unreleased change from main. Never include another feature
            # that has not received its own UAT acceptance.
            git fetch origin main uat
            git checkout -B production-candidate origin/main
            uat_sha="$(git rev-parse origin/uat)"
            main_sha="$(git rev-parse origin/main)"
            if [ "$merged_sha" != "$uat_sha" ] || [ "$(git rev-parse "$merged_sha^1")" != "$main_sha" ]; then
              echo "::warning::UAT contains additional changes or diverges from main; cannot safely release issue #$issue alone"
              continue
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git merge --no-ff origin/uat -m "release: UAT accepted issue #$issue"
            # Publish only the exact production merge commit we are deploying.
            git push origin HEAD:main
            # Never deploy the repository root: it contains automation and developer files.
            mkdir -p .cloudflare-release/public
            for file in index.html sw.js manifest.webmanifest icon-192.png icon-512.png icon-maskable-512.png; do
              test -s "$file" || { echo "::error::Missing public asset $file"; exit 1; }
              cp "$file" .cloudflare-release/public/
            done
            sed 's#"directory": "./"#"directory": "./.cloudflare-release/public"#' wrangler.jsonc > wrangler.release.jsonc
            grep -Fq '"directory": "./.cloudflare-release/public"' wrangler.release.jsonc
            npx --yes wrangler@4 deploy --config wrangler.release.jsonc
            gh issue comment "$issue" --body "<!-- acorn-cloudflare-published --> Promoted accepted UAT into main and published to Cloudflare from commit $(git rev-parse HEAD). GitHub Actions run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID."
            echo "Published accepted issue #$issue"
          done < /tmp/accepted
