name: Developer regression tests
on:
  push:
    branches: [main, uat, qa/offline-gameplay]
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and gameplay regression tests
        run: |
          node --check sw.js
          node --test tests/game.test.cjs

  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install developer-only browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Offline mobile and complete-trail browser QA
        run: node --test tests/browser.test.cjs tests/offline.browser.test.cjs

      - name: Save mobile QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-qa-screenshots
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
