name: Developer regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and gameplay regression tests
        run: node --test tests/game.test.cjs
