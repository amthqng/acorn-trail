name: Ready for Development intake

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: acorn-dev-intake
  cancel-in-progress: false

jobs:
  tech-lead:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install orchestration dependencies
        run: |
          npm install --prefix orchestration --no-audit --no-fund
          npm run --prefix orchestration check
      - name: Evaluate newly approved issue requirements
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: "2"
          PROJECT_STATUS: Ready for Development
          ACORN_AGENT_MODEL: gpt-4.1-mini
        run: |
          test -n "$PROJECT_TOKEN" || { echo "PROJECTS_TOKEN unavailable"; exit 1; }
          GH_TOKEN="$PROJECT_TOKEN" bash scripts/list-project-status-issues.sh | sort -nu > /tmp/ready-issues
          while IFS= read -r issue; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || continue
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > /tmp/issue.json
            if ! jq -e '.state=="open" and (has("pull_request")|not)' /tmp/issue.json >/dev/null; then continue; fi
            mkdir -p inputs
            cp /tmp/issue.json inputs/dev-issue.json
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" > inputs/issue-comments.json
            ISSUE_NUMBER="$issue" npx --prefix orchestration tsx orchestration/tech-lead.ts
            # Assess every run but avoid posting an identical report repeatedly.
            previous="$(jq -r '[.[]|select(.body|contains("<!-- acorn-tech-lead-gate -->"))]|last|.body // ""' inputs/issue-comments.json)"
            current="$(cat artifacts/development-intake/comment.md)"
            if [ "$previous" != "$current" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file artifacts/development-intake/comment.md
            else
              echo "Assessment unchanged for issue #$issue"
            fi
            if [ "$(cat artifacts/development-intake/verdict.txt)" = "NEEDS_CLARIFICATION" ]; then
              echo "::warning::Issue #$issue requires clarification; leaving it in Ready for Development"
            else
              echo "Issue #$issue passed technical intake; implementation automation is not yet enabled"
            fi
          done < /tmp/ready-issues
