name: Kanban discovery watcher

# GitHub Projects status changes do not directly fire repository Actions events.
# Scan the user's Project periodically and process cards moved into Discovery.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: acorn-kanban-discovery
  cancel-in-progress: false

jobs:
  process-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and type-check orchestrator
        run: |
          npm install --prefix orchestration --no-audit --no-fund
          npm run --prefix orchestration check
      - name: Discover cards and run research for new requests
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACORN_AGENT_MODEL: gpt-4.1-mini
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: "2"
        run: |
          test -n "$PROJECT_TOKEN" || { echo "::error::PROJECTS_TOKEN missing"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::OPENAI_API_KEY missing"; exit 1; }
          GH_TOKEN="$PROJECT_TOKEN" bash scripts/list-discovery-issues.sh | sort -n -u > /tmp/acorn-discovery-ids
          if [ ! -s /tmp/acorn-discovery-ids ]; then
            echo "No cards awaiting discovery"
            exit 0
          fi
          while IFS= read -r issue; do
            [[ "$issue" =~ ^[1-9][0-9]*$ ]] || exit 1
            echo "::group::Discovering issue #$issue"
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue" > /tmp/acorn-issue.json
            if ! jq -e '(.state == "open") and (has("pull_request") | not)' /tmp/acorn-issue.json > /dev/null; then
              echo "Skipping closed issue or pull request #$issue"
              echo "::endgroup::"
              continue
            fi
            # The marker is inserted only after research is posted successfully.
            # If project status update fails, next scan retries status only.
            count="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$issue/comments?per_page=100" --jq '.[].body' | grep -Fc '<!-- acorn-feature-discovery -->' || true)"
            if [ "$count" = "0" ]; then
              mkdir -p inputs
              cp /tmp/acorn-issue.json inputs/feature-issue.json
              FEATURE_ISSUE_NUMBER="$issue" npx --prefix orchestration tsx orchestration/discover-issue.ts
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file artifacts/feature-discovery/comment.md
            else
              echo "Discovery report already on issue; retrying board status only"
            fi
            PROJECT_STATUS="Awaiting Approval" GH_TOKEN="$PROJECT_TOKEN" bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$issue"
            echo "::endgroup::"
          done < /tmp/acorn-discovery-ids
