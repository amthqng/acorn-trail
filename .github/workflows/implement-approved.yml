name: Implement approved feature
run-name: Implement issue #${{ inputs.issue_number }}

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Approved issue in Ready for Development or retry in In Development'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: acorn-implement-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: uat
          # The coding agent must never inherit a GitHub write credential.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify issue approval from board
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
          PROJECT_STATUS: Ready for Development
        run: |
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || exit 1
          test -n "$GH_TOKEN" || { echo 'PROJECTS_TOKEN not available'; exit 1; }
          if ! bash scripts/list-project-status-issues.sh | grep -Fx "$ISSUE_NUMBER"; then
            PROJECT_STATUS="In Development" bash scripts/list-project-status-issues.sh | grep -Fx "$ISSUE_NUMBER" || { echo "Issue is not in approved or development status"; exit 1; }
          fi
      - name: Fetch approved issue and prepare branch
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          mkdir -p inputs artifacts/implementation
          gh auth setup-git
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > inputs/dev-issue.json
          # Owner UAT rejection and approved acceptance criteria must reach both
          # Developer and Reviewer, not only the issue's original one-line body.
          gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" | jq -s 'add' > inputs/issue-comments.json
          jq -e '.state=="open" and (has("pull_request")|not)' inputs/dev-issue.json > /dev/null
          cp index.html inputs/original-index.html
          branch="agents/issue-$ISSUE_NUMBER"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            # The original candidate may already be merged into uat. When its
            # UAT was rejected and the board returned to In Development,
            # create a distinct correction branch; never overwrite a review.
            prior="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state all --json state --jq '.[0].state // empty')"
            if [ "$prior" != "MERGED" ]; then
              echo "Existing active or abandoned implementation branch $branch; refusing overwrite"; exit 1
            fi
            branch="agents/issue-$ISSUE_NUMBER-correction-$GITHUB_RUN_ID"
          fi
          git switch -c "$branch"
          echo "IMPLEMENTATION_BRANCH=$branch" >> "$GITHUB_ENV"
      - name: Move accepted work to In Development
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
          PROJECT_STATUS: In Development
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          test -n "$GH_TOKEN" || exit 1
          bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
      - name: Install test dependencies before sandboxing
        run: |
          npm install --prefix orchestration --no-audit --no-fund --package-lock=false
          npm run --prefix orchestration check
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Build complete approved developer brief
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/build-developer-brief.cjs
      - name: Choose bounded model and reasoning level
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/attempt-budget.cjs "${{ inputs.issue_number }}" --github-output
      - name: Run workspace coding agent against real source files
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          # Dispatches originate with our board controller, not the user.
          allow-bot-users: 'github-actions[bot]'
          prompt-file: inputs/developer-brief.md
          output-file: artifacts/implementation/notes.md
          model: ${{ steps.policy.outputs.model }}
          effort: ${{ steps.policy.outputs.effort }}
      - name: Independently enforce authorized source changes
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: node scripts/verify-developer-change.cjs
      - name: Verify budget and prevent unsupported test claims
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs");const p=fs.readFileSync("artifacts/implementation/status.txt","utf8").trim();if(p!=="IMPLEMENTED")process.exit(1)'
          # A generated feature test is never a substitute for the separately
          # owned browser acceptance and user-visible UAT check.
      - name: Mark QA & Review
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
          PROJECT_STATUS: QA & Review
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
      - name: Fast syntax and gameplay unit checks
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          node --check sw.js
          node --test tests/game.test.cjs
          shopt -s nullglob
          feature_tests=(tests/feature-"$ISSUE_NUMBER"-*.test.cjs)
          if (("${#feature_tests[@]}")); then node --test "${feature_tests[@]}"; fi
      - name: Check owner-rejected fall theme in actual offline browser
        if: inputs.issue_number == '83'
        run: node --test tests/fall-theme-acceptance.browser.test.cjs
      - name: Independent owner-feedback visual acceptance on iPhone and desktop
        if: inputs.issue_number == '83'
        run: node --test tests/uat-visual-83.browser.test.cjs
      - name: General mobile and desktop QA smoke
        run: node --test tests/qa-smoke.test.cjs
      - name: Determine whether owner requirements include a visual change
        id: visual_scope
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const issue=JSON.parse(fs.readFileSync('inputs/dev-issue.json','utf8'));
          const comments=JSON.parse(fs.readFileSync('inputs/issue-comments.json','utf8'));
          const owner=process.env.GITHUB_REPOSITORY.split('/')[0];
          const requirements=[issue.title,issue.body,...comments.filter(c=>c.user?.login===owner).map(c=>c.body)].join(' ');
          const visual=issue.number===83 || /\b(visual|design|layout|theme|colors?|background|borders?|panels?|screen|scenery|trees?|characters?|friends?|team setup|typography|font|icons?|interface|ui|ux|appearance)\b/i.test(requirements);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'required='+visual+'\n');
          console.log('UX screenshot review required: '+visual);
          NODE
      - name: Capture actual before-and-after mobile and desktop UX evidence
        if: steps.visual_scope.outputs.required == 'true'
        run: node scripts/capture-visual-qa.cjs
      - name: Independent UX agent reviews the rendered design against owner feedback
        if: steps.visual_scope.outputs.required == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACORN_AGENT_MODEL: gpt-4.1
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          npx --prefix orchestration tsx orchestration/visual-review.ts
          test "$(cat artifacts/implementation/visual-verdict.txt)" = PASS
      # This step runs ONLY after the preceding unit, feature, offline-browser
      # acceptance and mobile/desktop smoke jobs all exit successfully.
      # It gives the independent reviewer verifiable CI evidence, not developer
      # prose or a claim that manual UAT has already happened.
      - name: Assert required visual evidence was actually recorded
        if: steps.visual_scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          test -s artifacts/implementation/visual-verdict.txt
          grep -Fxq PASS artifacts/implementation/visual-verdict.txt
          test -d artifacts/implementation/visual-qa
          find artifacts/implementation/visual-qa -type f -name '*.png' -size +0c | grep -q .
      - name: Record successful automated QA for independent reviewer
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/implementation
          {
            echo 'AUTOMATED_QA_RESULT: PASS'
            echo "GITHUB_ACTIONS_RUN: $GITHUB_RUN_ID"
            echo 'AUTOMATED_QA_CHECKS:'
            echo '- node --check sw.js: PASSED'
            echo '- node --test tests/game.test.cjs: PASSED'
            echo '- issue-specific feature unit tests when present: PASSED'
            echo '- offline mobile and desktop Playwright smoke: PASSED'
            if [ -f artifacts/implementation/visual-verdict.txt ]; then
              echo '- independent UX visual reviewer inspected before/after screenshots at phone and desktop sizes: PASSED'
            fi
            if [ "$ISSUE_NUMBER" = 83 ]; then
              echo '- independently authored autumn-theme browser comparison against the previous UAT build: PASSED'
              echo '- owner-rejected home panel borders checked against computed browser styles at mobile and desktop sizes: PASSED'
              echo '- runtime palette, multiple scenes and visible map changed: VERIFIED'
            fi
            echo 'MANUAL_PRODUCT_OWNER_UAT: NOT YET PERFORMED (occurs after QA and UAT deployment)'
            echo 'This file is emitted by the workflow only after its automated test steps succeed.'
          } > artifacts/implementation/qa-evidence.txt
      - name: Independent reviewer and UAT document
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ACORN_AGENT_MODEL: gpt-4.1
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          npx --prefix orchestration tsx orchestration/review-implementation.ts
          test "$(cat artifacts/implementation/review-verdict.txt)" = "PASS" || { cat artifacts/implementation/uat.md; exit 1; }
      - name: Open draft implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          shopt -s nullglob
          feature_tests=(tests/feature-"$ISSUE_NUMBER"-*.test.cjs)
          if (("${#feature_tests[@]}")); then git add -- "${feature_tests[@]}"; fi
          git diff --cached --quiet && { echo "::error::No implementation changes staged"; exit 1; }
          git commit -m "feat: implement approved issue #$ISSUE_NUMBER"
          # Token is supplied only to the trusted publish step after Codex is done.
          gh auth setup-git
          git push origin "$IMPLEMENTATION_BRANCH"
          gh pr create --base uat --head "$IMPLEMENTATION_BRANCH" --title "Implement issue #$ISSUE_NUMBER" --body "$(cat artifacts/implementation/uat.md)"
          gh issue comment "$ISSUE_NUMBER" --body "Implementation PR submitted for independent GitHub approval after regression tests and AI reviewer passed. It has **not** been merged or released. See the PR for UAT notes."
      - name: Leave PR for central QA approval and UAT handoff
        run: echo "Implementation tested; central QA job verifies and merges into uat."
      - name: Upload tested UAT candidate
        uses: actions/upload-artifact@v4
        with:
          name: uat-issue-${{ inputs.issue_number }}
          path: |
            index.html
            sw.js
            manifest.webmanifest
            icon-192.png
            icon-512.png
            icon-maskable-512.png
          if-no-files-found: error
          retention-days: 30
      - name: Record failed stage and retain In Development
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PROJECT_OWNER: amthqng
          PROJECT_NUMBER: '2'
        run: |
          stage="In Development"
          if [ -f artifacts/implementation/visual-verdict.txt ] && grep -Fxq REVISE artifacts/implementation/visual-verdict.txt; then
            summary="$(head -c 4500 artifacts/implementation/visual-review.md)"
            gh issue comment "$ISSUE_NUMBER" --body "$(printf '<!-- acorn-review-rejected -->\nUX visual review requested a correction for #%s:\n%s\n' "$ISSUE_NUMBER" "$summary")"
          elif [ -f artifacts/implementation/review-verdict.txt ] && grep -Fxq REVISE artifacts/implementation/review-verdict.txt; then
            # Reviewer rejection is technical development feedback, not another
            # QA attempt on the old merged UAT candidate.
            summary="$(sed -n '/^## Reviewer verdict:/,$p' artifacts/implementation/uat.md | head -c 4500)"
            gh issue comment "$ISSUE_NUMBER" --body "$(printf '<!-- acorn-review-rejected -->\nReviewer requested a correction for #%s:\n%s\n' "$ISSUE_NUMBER" "$summary")"
          elif PROJECT_STATUS="QA & Review" GH_TOKEN="$PROJECT_TOKEN" bash scripts/list-project-status-issues.sh | grep -Fxq "$ISSUE_NUMBER"; then
            stage="QA & Review"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "<!-- acorn-stage-failure --> Workflow failed during $stage. See $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Not ready for UAT."
          PROJECT_STATUS="$stage" GH_TOKEN="$PROJECT_TOKEN" bash scripts/add-issue-to-project.sh "https://github.com/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER"
      - name: Upload UAT and reviewer output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: implementation-review
          path: artifacts/implementation/
          if-no-files-found: warn
          retention-days: 7
