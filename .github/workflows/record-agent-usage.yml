name: Record Codex usage by issue
on:
  workflow_run:
    workflows: [Implement approved feature]
    types: [completed]
permissions:
  actions: read
  issues: write
  contents: read
jobs:
  usage:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Post bounded token-usage report to issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/agent-usage-report.cjs
