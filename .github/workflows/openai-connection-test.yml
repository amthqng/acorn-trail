name: OpenAI API connection test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-test:
    name: Verify OpenAI API access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check repository secret is configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not configured in repository Actions secrets."
            exit 1
          fi
      - name: Make one small API request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          payload = {
              "model": "gpt-4.1-mini",
              "input": "Reply with exactly: API connection OK",
              "max_output_tokens": 25,
          }
          request = urllib.request.Request(
              "https://api.openai.com/v1/responses",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + os.environ["OPENAI_API_KEY"],
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              print(f"OpenAI API returned HTTP {error.code}. Verify the key, billing, and model access.")
              sys.exit(1)
          except Exception as error:
              print(f"OpenAI API connectivity check failed: {type(error).__name__}")
              sys.exit(1)
          if result.get("id") and result.get("status") == "completed":
              print("SUCCESS: OpenAI API request completed.")
              print("Model:", result.get("model", "unknown"))
          else:
              print("API request did not complete successfully.")
              sys.exit(1)
          PY
